services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    container_name: keydungeon-api
    env_file: .env
    environment:
      # Keep the SQLite database on the named volume instead of the image.
      DATABASE_URL: sqlite:///data/keydungeon.db
    ports:
      - "4321:4321"
    volumes:
      - keydungeon_data:/data
    restart: unless-stopped

volumes:
  keydungeon_data:
