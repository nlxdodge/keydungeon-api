[package]
name = "keydungeon-api"
version = "0.1.0"
edition = "2024"
authors = ["nlxdodge"]

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
bcrypt = "0.19.3"
log = "0.4.28"
env_logger = "0.11.11"
dotenvy = "0.15.7"
serde_json = "1.0.149"
jsonwebtoken = "11.0.0"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.1", features = ["full"] }
secrecy = { version = "0.10.3", features = ["serde"] }
zeroize = { version = "1.8.2", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-async-std", "postgres", "macros", "uuid", "chrono"] }
uuid  = { version = "1.24.0", features = ["serde", "v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
postgres = { version = "0.19.14", features = ["with-serde_json-1"] }
