[package]
name = "keydungeon-api"
version = "0.1.0"
edition = "2024"
authors = ["nlxdodge"]

[dependencies]
# Web
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace", "cors", "limit", "timeout"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# DB - SQLite, single runtime
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "macros"] }
uuid = { version = "1.29", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Auth & Security
argon2 = "0.6" # for master password
chacha20poly1305 = { version = "0.11", features = ["zeroize"] } # for vault encryption
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
password-hash = "0.6.1"
base64 = "0.23.1"

# Secrets handling - good that you already have this, keep it
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1.9", features = ["derive", "zeroize_derive"] }

# Config / Observability
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
